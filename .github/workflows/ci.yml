name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Python Lint & Tests ────────────────────────────────────────────────────
  python-ci:
    name: Python lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Install CPU-only torch so CI doesn't need GPU drivers
          pip install torch==2.2.1 torchvision==0.17.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings (non-blocking)
          flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Check for hardcoded secrets
        run: |
          # Fail if any real-looking key strings are found
          ! grep -rn --include="*.py" --include="*.tf" \
            -E "(AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{32,})" . || \
            (echo "Potential hardcoded credential detected!" && exit 1)

  # ─── Terraform Validation ────────────────────────────────────────────────────
  terraform-ci:
    name: Terraform validate & format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init (local only — no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate
